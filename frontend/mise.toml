# Frontend project config (mise monorepo). Addressed from the repo root as
# `//frontend:<task>`, or by bare name from inside this directory (`mise run check`).

[tools]
# Mirror frontend/Dockerfile's node:24-* base.
node = "24"

[tasks.install]
description = "Install npm dependencies."
sources = ["package.json", "package-lock.json"]
outputs = { auto = true }
run = "npm install"

[tasks.build]
description = "Build the frontend for production."
depends = ["install", "generate-frontend-assets"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && npm run build:only"
npm run build:only
'''

[tasks.dev]
description = "Start the Vite dev server."
run = "npm run dev"

[tasks.fmt]
description = "Format frontend code with prettier. Checks only unless --write is passed."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
flag "--write" help="Reformat in place instead of just checking."
arg "<options>" var=#true required=#false help="Extra prettier args."
'''
run = '''
set -eu
prettier_mode="--check"
if [ -n "${usage_write:-}" ]; then
  prettier_mode="--write"
fi
. ../scripts/container_dispatch.sh
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/prettier $prettier_mode . ${usage_options:-}"
npx prettier "$prettier_mode" . ${usage_options:-}
'''

[tasks.lint]
description = "Lint with eslint."
depends = ["install", "generate-frontend-assets"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
arg "<options>" var=#true required=#false help="Extra eslint args."
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/eslint . ${usage_options:-}"
npm run lint -- ${usage_options:-}
'''

[tasks.typecheck]
description = "Type-check with tsc."
depends = ["install", "generate-frontend-assets"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
arg "<options>" var=#true required=#false help="Extra tsc args."
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/tsc --noEmit -p tsconfig.app.json ${usage_options:-}"
npm run typecheck -- ${usage_options:-}
'''

[tasks.test]
description = "Run vitest."
depends = ["install", "generate-frontend-assets"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
arg "<options>" var=#true required=#false help="Extra vitest args."
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/vitest --run ${usage_options:-}"
npm run test -- --run ${usage_options:-}
'''

# --container keeps the bind-mount (for live source), but must not let it shadow the
# image's own tooling: json2ts is invoked from the image's baked node_modules/.bin, and
# UV_PROJECT_ENVIRONMENT is redirected to a container-only scratch path so `uv run
# --directory ../backend` (which resolves into the bind-mounted /src/backend) syncs its
# own throwaway venv instead of reading/writing the host's .venv.
[tasks.generate-types]
description = "Regenerate the frontend's TypeScript types from the backend Pydantic models."
depends = ["install", "//backend:sync"]
sources = ["../backend/tenantfirstaid/schema.py", "../backend/tenantfirstaid/location.py", "../backend/tenantfirstaid/referrals.py", "../backend/scripts/generate_types.py"]
outputs = { auto = true }
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
bkuv="UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend"
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && mkdir -p src/types && $bkuv python scripts/generate_types.py | /workspace/frontend/node_modules/.bin/json2ts --unreachableDefinitions --additionalProperties false > src/types/models.ts"
. scripts/require-backend-uv.sh
npm run generate-types
'''

[tasks.generate-referrals]
description = "Regenerate the frontend's bundled referral catalog from the backend referrals data."
depends = ["install", "//backend:sync"]
sources = ["../backend/tenantfirstaid/referrals.py", "../backend/tenantfirstaid/referrals_data.json", "../backend/scripts/generate_referrals.py"]
outputs = { auto = true }
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
bkuv="UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend"
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && mkdir -p src/generated && $bkuv python scripts/generate_referrals.py > src/generated/referrals.ts"
. scripts/require-backend-uv.sh
npm run generate-referrals
'''

[tasks.generate-frontend-assets]
description = "Regenerate frontend build-time assets (types + referral catalog) from the backend."
depends = ["install", "//backend:sync"]
sources = ["../backend/tenantfirstaid/schema.py", "../backend/tenantfirstaid/location.py", "../backend/tenantfirstaid/referrals.py", "../backend/tenantfirstaid/referrals_data.json", "../backend/scripts/generate_types.py", "../backend/scripts/generate_referrals.py"]
outputs = { auto = true }
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
. ../scripts/container_dispatch.sh
bkuv="UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend"
container_dispatch \
  --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
  --cache-key-files "frontend/package.json frontend/package-lock.json" \
  --cmd "cd /src/frontend && mkdir -p src/types src/generated && $bkuv python scripts/generate_types.py | /workspace/frontend/node_modules/.bin/json2ts --unreachableDefinitions --additionalProperties false > src/types/models.ts && $bkuv python scripts/generate_referrals.py > src/generated/referrals.ts"
. scripts/require-backend-uv.sh
npm run generate-frontend-assets
'''

[tasks.check]
description = "Frontend: fmt, generate-frontend-assets, build, typecheck, lint, test."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  # The frontend build context is the repo root (see docker-compose.yml); the ci
  # stage's default command already runs the full check suite.
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}"
fi
# Check formatting first (before asset generation writes files) so failures
# are reported rather than silently reformatted out from under the check.
mise run fmt
# Generate assets once up front. build/lint/typecheck/test each also depend on
# generate-frontend-assets, so this run is what actually regenerates the files;
# its sources/outputs caching then makes each dependent task's re-run of it a
# cheap no-op instead of a race with a concurrent regeneration.
mise run generate-frontend-assets
mise run --continue-on-error -o keep-order build ::: lint ::: typecheck ::: test
'''
