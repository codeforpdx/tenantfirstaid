# Frontend project config (mise monorepo). Addressed from the repo root as
# `//frontend:<task>`, or by bare name from inside this directory (`mise run check`).

[tools]
# Mirror frontend/Dockerfile's node:24-* base.
node = "24"

[tasks.install]
description = "Install npm dependencies."
sources = ["package.json", "package-lock.json"]
outputs = { auto = true }
run = "npm install"

[tasks.build]
description = "Build the frontend for production."
depends = ["install", "generate-frontend-assets"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/npm run build"
fi
npm run build
'''

[tasks.dev]
description = "Start the Vite dev server."
run = "npm run dev"

[tasks.fmt]
description = "Format frontend code with prettier."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
flag "--write" help="With --container: bind-mount and reformat the host tree in place."
arg "<options>" var=#true required=#false help="Extra prettier args."
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  if [ -n "${usage_write:-}" ]; then
    exec mise run //:_container-run \
      --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
      --engine "${usage_engine:-auto}" \
      --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
      --cache-key-files "frontend/package.json frontend/package-lock.json" \
      --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/prettier --write ."
  fi
    exec mise run //:_container-run \
      --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
      --engine "${usage_engine:-auto}" \
      --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
      --cache-key-files "frontend/package.json frontend/package-lock.json" \
      --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/prettier --check ."
fi
npm run format -- ${usage_options:-}
'''

[tasks.lint]
description = "Lint with eslint."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
arg "<options>" var=#true required=#false help="Extra eslint args."
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/eslint . ${usage_options:-}"
fi
npm run lint -- ${usage_options:-}
'''

[tasks.typecheck]
description = "Type-check with tsc."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
arg "<options>" var=#true required=#false help="Extra tsc args."
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/tsc --noEmit -p tsconfig.app.json ${usage_options:-}"
fi
npm run typecheck -- ${usage_options:-}
'''

[tasks.test]
description = "Run vitest."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
arg "<options>" var=#true required=#false help="Extra vitest args."
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && /workspace/frontend/node_modules/.bin/vitest --run ${usage_options:-}"
fi
npm run test -- --run ${usage_options:-}
'''

# --container keeps the bind-mount (for live source), but must not let it shadow the
# image's own tooling: json2ts is invoked from the image's baked node_modules/.bin, and
# UV_PROJECT_ENVIRONMENT is redirected to a container-only scratch path so `uv run
# --directory ../backend` (which resolves into the bind-mounted /src/backend) syncs its
# own throwaway venv instead of reading/writing the host's .venv.
[tasks.generate-types]
description = "Regenerate the frontend's TypeScript types from the backend Pydantic models."
depends = ["install", "//backend:sync"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && mkdir -p src/types && UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend python scripts/generate_types.py | /workspace/frontend/node_modules/.bin/json2ts --unreachableDefinitions --additionalProperties false > src/types/models.ts"
fi
uvbin=$(mise -C ../backend which uv)
if [ -z "$uvbin" ] || [ ! -x "$uvbin" ]; then
  echo "ERROR: Backend uv binary not found. Please run 'mise install' in the backend directory." >&2
  exit 1
fi
PATH="$(dirname "$uvbin"):$PATH" npm run generate-types
'''

[tasks.generate-referrals]
description = "Regenerate the frontend's bundled referral catalog from the backend referrals data."
depends = ["install", "//backend:sync"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && mkdir -p src/generated && UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend python scripts/generate_referrals.py > src/generated/referrals.ts"
fi
uvbin=$(mise -C ../backend which uv)
if [ -z "$uvbin" ] || [ ! -x "$uvbin" ]; then
  echo "ERROR: Backend uv binary not found. Please run 'mise install' in the backend directory." >&2
  exit 1
fi
PATH="$(dirname "$uvbin"):$PATH" npm run generate-referrals
'''

[tasks.generate-frontend-assets]
description = "Regenerate frontend build-time assets (types + referral catalog) from the backend."
depends = ["install", "//backend:sync"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}" \
    --bind-src "$(git -C "$PWD" rev-parse --show-toplevel)" --bind-dst /src --as-user \
    --cache-key-files "frontend/package.json frontend/package-lock.json" \
    --cmd "cd /src/frontend && mkdir -p src/types src/generated && UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend python scripts/generate_types.py | /workspace/frontend/node_modules/.bin/json2ts --unreachableDefinitions --additionalProperties false > src/types/models.ts && UV_PROJECT_ENVIRONMENT=/tmp/backend-venv uv run --directory ../backend python scripts/generate_referrals.py > src/generated/referrals.ts"
fi
uvbin=$(mise -C ../backend which uv)
if [ -z "$uvbin" ] || [ ! -x "$uvbin" ]; then
  echo "ERROR: Backend uv binary not found. Please run 'mise install' in the backend directory." >&2
  exit 1
fi
PATH="$(dirname "$uvbin"):$PATH" npm run generate-frontend-assets
'''

[tasks.check]
description = "Frontend: generate-frontend-assets, typecheck, lint, test."
depends = ["install"]
usage = '''
flag "--container" help="Run in the Dockerfile ci image instead of on the host."
flag "--engine <engine>" help="Container engine: auto|docker|container|podman." default="auto"
'''
run = '''
set -eu
if [ -n "${usage_container:-}" ]; then
  # The frontend build context is the repo root (see docker-compose.yml); the ci
  # stage's default command already runs the full check suite.
  exec mise run //:_container-run \
    --image tenantfirstaid-frontend:ci --context . --dockerfile frontend/Dockerfile \
    --engine "${usage_engine:-auto}"
fi
# Prepare: format and generate assets in parallel
mise run -o keep-order fmt ::: generate-frontend-assets
# Verify: build and other checks in parallel
mise run --continue-on-error -o keep-order build ::: lint ::: typecheck ::: test
'''
